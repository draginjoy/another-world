<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내가 몰랐던 또 다른 세계</title>

<style>
body {
    margin: 0;
    background: #111a2d;
    color: #f5f1ec;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}

.container {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 24px 80px;
}

h1 {
    font-size: 32px;
    font-weight: 500;
    text-align: center;
    margin-bottom: 50px;
}

.chapter {
    margin-bottom: 80px;
}

.chapter-title {
    font-size: 14px;
    letter-spacing: 4px;
    opacity: 0.7;
    text-align: center;
    margin-bottom: 15px;
}

.chapter-name {
    font-size: 32px;
    text-align: center;
    margin-bottom: 35px;
}

.text {
    font-size: 18px;
    line-height: 2;
    white-space: pre-line;
}

.divider {
    width: 40px;
    margin: 50px auto;
    border-top: 1px solid rgba(255,255,255,0.4);
}
</style>
</head>

<body>

<div class="container">

<h1>내가 몰랐던 또 다른 세계</h1>

<div class="chapter">

<div class="chapter-title">1부</div>
<div class="chapter-name">[ 과거 ]</div>

<div class="divider"></div>

<div class="text">
여기에 1부의 글이 들어갑니다.
</div>

</div>

</div>

</body>
</html>
